---
- name: Create Cleanuparr directory
  ansible.builtin.file:
    path: "{{ data_dir }}/cleanuparr/config"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Deploy Cleanuparr docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/cleanuparr/docker-compose.yml"
    mode: "0644"

- name: Start Cleanuparr
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/cleanuparr"
    state: present
