---
- name: Create Prowlarr directories
  ansible.builtin.file:
    path: "{{ data_dir }}/prowlarr/config"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Deploy Prowlarr docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/prowlarr/docker-compose.yml"
    mode: "0644"

- name: Start Prowlarr
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/prowlarr"
    state: present
