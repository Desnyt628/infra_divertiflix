---
- name: Create BookStack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ data_dir }}/bookstack/data"
    - "{{ data_dir }}/bookstack/mysql"

- name: Deploy BookStack docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/bookstack/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Start BookStack
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/bookstack"
    state: present
