---
- name: Create Jellyseerr directories
  ansible.builtin.file:
    path: "{{ data_dir }}/jellyseerr/config"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Deploy Jellyseerr docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/jellyseerr/docker-compose.yml"
    mode: "0644"

- name: Start Jellyseerr
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/jellyseerr"
    state: present
