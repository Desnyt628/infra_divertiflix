---
- name: Create Sonarr directories
  ansible.builtin.file:
    path: "{{ data_dir }}/sonarr/config"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Deploy Sonarr docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/sonarr/docker-compose.yml"
    mode: "0644"

- name: Start Sonarr
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/sonarr"
    state: present
