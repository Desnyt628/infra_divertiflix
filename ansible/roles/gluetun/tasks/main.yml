---
- name: Create Gluetun directory
  ansible.builtin.file:
    path: "{{ data_dir }}/gluetun"
    state: directory
    mode: "0755"

- name: Deploy Gluetun docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/gluetun/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Start Gluetun
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/gluetun"
    state: present
  notify: Restart qBittorrent

# Restart qBittorrent right now (not at the end of the play) if Gluetun
# was recreated: see handlers/main.yml.
- name: Apply pending handlers
  ansible.builtin.meta: flush_handlers
