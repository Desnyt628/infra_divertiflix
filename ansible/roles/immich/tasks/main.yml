---
- name: Create Immich directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ storage_dir }}/immich/upload"
    - "{{ storage_dir }}/immich/postgres"
    - "{{ data_dir }}/immich"

- name: Deploy Immich docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/immich/docker-compose.yml"
    mode: "0600"
  no_log: true

- name: Start Immich
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/immich"
    state: present
