---
- name: Create media directories (one filesystem, so hardlinks work)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"
  loop:
    - "{{ storage_dir }}/movies"
    - "{{ storage_dir }}/tv"
    - "{{ storage_dir }}/download"
