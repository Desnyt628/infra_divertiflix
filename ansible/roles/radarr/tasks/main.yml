---
- name: Create Radarr directories
  ansible.builtin.file:
    path: "{{ data_dir }}/radarr/config"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Deploy Radarr docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/radarr/docker-compose.yml"
    mode: "0644"

- name: Start Radarr
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/radarr"
    state: present
