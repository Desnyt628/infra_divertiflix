---
- name: Create Jellyfin directories
  ansible.builtin.file:
    path: "{{ data_dir }}/jellyfin/config"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Deploy Jellyfin docker-compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ data_dir }}/jellyfin/docker-compose.yml"
    mode: "0644"

- name: Start Jellyfin
  community.docker.docker_compose_v2:
    project_src: "{{ data_dir }}/jellyfin"
    state: present
