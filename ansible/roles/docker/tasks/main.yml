---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - dnsutils
      - python3-debian   # required by ansible.builtin.deb822_repository
    state: present
    update_cache: true

- name: Ensure keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Remove the legacy one-line Docker source (replaced by docker.sources)
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Add Docker repository (deb822 format)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures:
      - "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker, Compose plugin and the Python SDK used by Ansible modules
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - python3-docker
    state: present
    update_cache: true

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Allow the SSH user to run docker without sudo
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Create the shared Docker network with a fixed subnet
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present
    ipam_config:
      - subnet: "{{ docker_network_subnet }}"
        gateway: "{{ docker_network_gateway }}"

# ---- Checks (evidence for the demo) ----
- name: Check Docker and Compose versions
  ansible.builtin.command: "{{ item }}"
  loop:
    - docker --version
    - docker compose version
  register: docker_versions
  changed_when: false

- name: Run test container
  ansible.builtin.command: docker run --rm hello-world
  register: docker_hello_world
  changed_when: false

- name: Show check results
  ansible.builtin.debug:
    msg:
      - "{{ docker_versions.results | map(attribute='stdout') | list }}"
      - "{{ docker_hello_world.stdout_lines | first }}"
